
services:

  backend:
    build:
      context: ./docker/php
      args:
        USER_ID: ${UID}
        GROUP_ID: ${GID}
    container_name: backstage_backend
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8080:80"
    depends_on:
      - db



  db:
    image: mariadb:10.6.18
    container_name: backstage_db
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: backstage
      MARIADB_USER: backstage
      MARIADB_PASSWORD: backstage
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  frontend:
    image: node:20
    container_name: backstage_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"

volumes:
  db_data:
